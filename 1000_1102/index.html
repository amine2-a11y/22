<!DOCTYPE html>
<html manifest="offline.appcache" lang="en" manifest="offline.appcache">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AMINE PS4 PS4</title>
  <link rel="stylesheet" href="includes/style.css">
  <link rel="stylesheet" href="../theme.css">
<link rel="stylesheet" href="../unified-theme.css">
<style>html,body{min-height:100%;}body{background:#050914 url("background.jpg") center center/cover no-repeat fixed !important;}</style>

<style id="offline-bg-fix">html,body{min-height:100%;background-color:#050914!important;}body{background-image:url("background.jpg")!important;background-position:center center!important;background-size:cover!important;background-repeat:no-repeat!important;background-attachment:fixed!important;}</style>
</head>
<body>

  <h1>AMINE PS4 PS4</h1>
  <h3 id="UA">Running on:</h3>

  <hr>

  <div class="btn-container">
    <form id="kernel-options">
      <input type="radio" name="kernel" id="netctrl-exploit" value="netctrl">
      <label for="netctrl-exploit">NetCtrl</label>
      <input type="radio" name="kernel" id="lapse-exploit" value="lapse">
      <label for="lapse-exploit">Lapse</label>
    </form>
    <button id="jeilbrek">Jailbreak</button>
    <div class="autoJb">
      <label for="autoJbInput" id="autoJbLabel">Auto Jailbreak</label>
      <input class="mt-2" id="autoJbInput" type="checkbox">
    </div>
  </div>

  <div class="main-layout">
    <pre id="console">Caching offline files... 0%</pre>
  </div>
<script>
    var scriptsLoaded = false;

    function triggerScripts() {
      if (scriptsLoaded) return;
      scriptsLoaded = true;

      var consoleLog = document.getElementById('console');
      if (consoleLog) consoleLog.innerText += "\nLoading main.js & script.js...";

      var s1 = document.createElement('script');
      s1.src = 'src/main.js';
      s1.onerror = function() {
        if (consoleLog) consoleLog.innerText += "\n❌ Error: Gagal memuat src/main.js (Cek path/file)";
      };
      
      s1.onload = function() {
        var s2 = document.createElement('script');
        s2.src = 'includes/script.js';
        s2.onerror = function() {
          if (consoleLog) consoleLog.innerText += "\n❌ Error: Gagal memuat includes/script.js (Cek path/file)";
        };
        document.body.appendChild(s2);
      };

      document.body.appendChild(s1);
    }

    if (window.applicationCache) {
      var appCache = window.applicationCache;
      var consoleLog = document.getElementById('console');

      appCache.addEventListener('progress', function(e) {
        if (e.lengthComputable && consoleLog) {
          var percent = Math.round((e.loaded / e.total) * 100);
          consoleLog.innerText = "Caching offline files... " + percent + "%";
        }
      }, false);

      appCache.addEventListener('cached', function() {
        if (consoleLog) consoleLog.innerText = "Offline cache complete (100%)!";
        triggerScripts();
      }, false);

      appCache.addEventListener('noupdate', function() {
        if (consoleLog) consoleLog.innerText = "Offline cache ready.";
        triggerScripts();
      }, false);

      appCache.addEventListener('error', function() {
        if (consoleLog) consoleLog.innerText = "Cache error/offline mode.";
        triggerScripts();
      }, false);

      setTimeout(function() {
        if (!scriptsLoaded) {
          if (consoleLog) consoleLog.innerText += "\n[Timeout] ...";
          triggerScripts();
        }
      }, 3000);

    } else {
      triggerScripts();
    }
  </script>
<script>

/* Firmware Auto Start dispatcher */
(function () {
  "use strict";
  function fw() {
    var t = (document.body && document.body.innerText) || "";
    var m = t.match(/\b(9\.00|9\.03|9\.04|9\.50|9\.60|10\.00|10\.01|10\.50|10\.70|10\.71|11\.00|11\.02|11\.50|11\.51|11\.52|11\.60|11\.70|11\.80|12\.00|12\.50|12\.70|12\.71|12\.72|13\.00)\b/);
    return m ? m[1] : null;
  }
  function start() {
    var selectors = [
      "#startJailbreak","#start-jailbreak","#start","#jeilbrek",
      "[data-action='jailbreak']",
      "button[id*='start' i][id*='jailbreak' i]",
      "a[id*='start' i][id*='jailbreak' i]"
    ];
    for (var i=0;i<selectors.length;i++) {
      var e=document.querySelector(selectors[i]);
      if(e && !e.disabled){ try{e.click(); return true;}catch(_){} }
    }
    return false;
  }
  window.FirmwareAutoStart = { firmware: fw(), start: start };
  if(document.readyState==="loading")
    document.addEventListener("DOMContentLoaded",function(){setTimeout(start,300);});
  else setTimeout(start,300);
})();

</script>

</body>
</html>
