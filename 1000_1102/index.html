<!doctype html>
<html lang="en" manifest="offline.appcache">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Amine PS4 Aurora · 10.00–11.02</title><link rel="stylesheet" href="../amine-aurora.css">
</head><body><main class="aurora-shell">
<header class="aurora-brand"><strong>AMINE <span>PS4</span></strong><span class="aurora-chip">AURORA · OFFLINE HUB</span></header>
<section class="aurora-hero"><div class="aurora-kicker">FIRMWARE EXPLOIT PROFILE</div><h1 class="aurora-title">PS4 <span style="color:var(--accent)">10.00 — 11.02</span></h1><p id="UA" class="aurora-sub">Detecting console environment…</p></section>
<section class="aurora-grid"><div class="aurora-card"><h2>KERNEL METHOD</h2><form id="kernel-options"><label class="aurora-option"><input type="radio" name="kernel" id="netctrl-exploit" value="netctrl" checked> NetCtrl</label><label class="aurora-option"><input type="radio" name="kernel" id="lapse-exploit" value="lapse"> Lapse</label></form><button id="jeilbrek" type="button">START JAILBREAK</button></div><div class="aurora-card"><h2>AUTOMATION</h2><label class="aurora-option" for="autoJbInput"><input id="autoJbInput" type="checkbox"><span id="autoJbLabel">Auto Jailbreak</span></label><p class="aurora-meta">Choose the method before starting the engine.</p></div></section><section class="aurora-card"><h2>ENGINE CONSOLE</h2><pre id="console" class="aurora-log">Preparing offline files…</pre></section>
<footer class="aurora-footer">AMINE PS4 · AURORA INTERFACE</footer>
</main>
<script src="./goldhen-status.js"></script>
<script>
    var scriptsLoaded = false;

    function triggerScripts() {
      if (scriptsLoaded) return;
      scriptsLoaded = true;

      var consoleLog = document.getElementById('console');
      if (consoleLog) consoleLog.innerText += "\nLoading main.js & script.js...";

      var s1 = document.createElement('script');
      s1.src = 'src/main.js';
      s1.onerror = function() {
        if (consoleLog) consoleLog.innerText += "\n❌ Error: Gagal memuat src/main.js (Cek path/file)";
      };
      
      s1.onload = function() {
        var s2 = document.createElement('script');
        s2.src = 'includes/script.js';
        s2.onerror = function() {
          if (consoleLog) consoleLog.innerText += "\n❌ Error: Gagal memuat includes/script.js (Cek path/file)";
        };
        document.body.appendChild(s2);
      };

      document.body.appendChild(s1);
    }

    if (window.applicationCache) {
      var appCache = window.applicationCache;
      var consoleLog = document.getElementById('console');

      appCache.addEventListener('progress', function(e) {
        if (e.lengthComputable && consoleLog) {
          var percent = Math.round((e.loaded / e.total) * 100);
          consoleLog.innerText = "Caching offline files... " + percent + "%";
        }
      }, false);

      appCache.addEventListener('cached', function() {
        if (consoleLog) consoleLog.innerText = "Offline cache complete (100%)!";
        triggerScripts();
      }, false);

      appCache.addEventListener('noupdate', function() {
        if (consoleLog) consoleLog.innerText = "Offline cache ready.";
        triggerScripts();
      }, false);

      appCache.addEventListener('error', function() {
        if (consoleLog) consoleLog.innerText = "Cache error/offline mode.";
        triggerScripts();
      }, false);

      setTimeout(function() {
        if (!scriptsLoaded) {
          if (consoleLog) consoleLog.innerText += "\n[Timeout] ...";
          triggerScripts();
        }
      }, 3000);

    } else {
      triggerScripts();
    }
  </script>
<script>

/* Firmware Auto Start dispatcher */
(function () {
  "use strict";
  function fw() {
    var t = (document.body && document.body.innerText) || "";
    var m = t.match(/\b(9\.00|9\.03|9\.04|9\.50|9\.60|10\.00|10\.01|10\.50|10\.70|10\.71|11\.00|11\.02|11\.50|11\.51|11\.52|11\.60|11\.70|11\.80|12\.00|12\.50|12\.70|12\.71|12\.72|13\.00)\b/);
    return m ? m[1] : null;
  }
  function start() {
    var selectors = [
      "#startJailbreak","#start-jailbreak","#start","#jeilbrek",
      "[data-action='jailbreak']",
      "button[id*='start' i][id*='jailbreak' i]",
      "a[id*='start' i][id*='jailbreak' i]"
    ];
    for (var i=0;i<selectors.length;i++) {
      var e=document.querySelector(selectors[i]);
      if(e && !e.disabled){ try{e.click(); return true;}catch(_){} }
    }
    return false;
  }
  window.FirmwareAutoStart = { firmware: fw(), start: start };
  if(document.readyState==="loading")
    document.addEventListener("DOMContentLoaded",function(){setTimeout(start,300);});
  else setTimeout(start,300);
})();

</script>
</body></html>
