<!doctype html>
<html lang="en" manifest="cache.appcache">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>AMINE PS4 · </title>
    
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;min-height:100%;overflow:hidden}
body{
 background: linear-gradient(rgba(0,8,18,.08),rgba(0,8,18,.22)), url("amine_ps4_background.jpg") center/cover no-repeat fixed;
 color:#efffe9;font:15px/1.45 "Segoe UI",system-ui,sans-serif;position:relative
}
body:before{content:"";position:fixed;inset:-15%;background:radial-gradient(ellipse,rgba(235,255,220,.13),transparent 45%);filter:blur(20px);animation:fog 8s ease-in-out infinite alternate;pointer-events:none}
body:after{content:"";position:fixed;bottom:9px;left:0;right:0;text-align:center;letter-spacing:8px;font:700 12px monospace;color:rgba(245,255,225,.34);pointer-events:none}
#brand{position:relative;z-index:2;text-align:center;padding:18px 10px;background:rgba(30,65,31,.58);border-bottom:2px solid rgba(220,255,140,.35);text-shadow:0 2px 8px #182718}
#brand b{font-size:20px;font-weight:900;letter-spacing:.18em;color:#f2ffd9}
#spin{position:fixed;z-index:3;top:calc(50% + 20px);left:50%;width:58px;height:58px;margin:-29px 0 0 -29px;border:5px solid rgba(220,255,190,.25);border-top-color:#efff88;border-right-color:#ff8170;border-radius:50%;animation:spin .75s linear infinite;box-shadow:0 0 22px rgba(190,255,100,.4)}
#msg{position:fixed;z-index:3;top:50%;left:0;right:0;transform:translateY(-50%);text-align:center;font-size:18px;font-weight:800;letter-spacing:1px;text-shadow:0 2px 9px #162516}
#wrap{padding:0;position:relative;z-index:2}
#state,#out{display:none}
body.done #spin,body.fail #spin{display:none}
body.fail #msg{display:block}
body.log #spin,body.log #msg{display:none}
body.log #wrap{padding:18px}
body.log #state{display:block;font-size:24px;font-weight:800;margin:0 0 10px;color:#efffc4}
body.log #out{display:block;white-space:pre-wrap;font:12px/1.45 Consolas,monospace;background:rgba(20,45,24,.70);border:1px solid rgba(220,255,150,.35);border-radius:10px;padding:12px;height:calc(100vh - 145px);overflow-y:auto;box-shadow:0 8px 35px rgba(0,0,0,.25)}
.ok,.safe{color:#d9ff92}.bad,.danger{color:#ffaaa0}.warn{color:#fff09a}code{color:#d7efb4}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes fog{from{transform:translateX(-2%) scale(1)}to{transform:translateX(2%) translateY(2%) scale(1.08)}}
</style>
  </head>
  <body>
    <div id="brand">
      <b>☠ AMINE PS4 · E ☠</b>
    </div>
    <div id="spin"></div>
    <div id="msg">Restart your console</div>
    <div id="wrap">
      <div id="state"></div>
      <div id="out"></div>
    </div>
    <script>
      // Safe page-lifecycle cleanup: release UI/media resources when leaving the page.
      // This does not alter exploit, payload, kernel patches, or offsets.
      (function () {
        var cleaned = false;
        function cleanupPageResources() {
          if (cleaned) return;
          cleaned = true;
          try {
            document.documentElement.style.animation = "none";
            document.body.style.animation = "none";
            var media = document.querySelectorAll("audio,video");
            for (var i = 0; i < media.length; i++) {
              try { media[i].pause(); } catch (e) {}
              try { media[i].removeAttribute("src"); media[i].load(); } catch (e) {}
            }
          } catch (e) {}
        }
        window.addEventListener("pagehide", cleanupPageResources, false);
        window.addEventListener("beforeunload", cleanupPageResources, false);
      })();
    </script>
    <script type="module">
      import "./jb.js?v=10";
    </script>
  </body>
</html>
