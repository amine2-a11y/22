<!doctype html>
<html lang="en" manifest="cache.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Amine PS4 PS4</title>
<link rel="stylesheet" href="../theme.css">
<link rel="stylesheet" href="../unified-theme.css">
<style>
html,body{width:100%;height:100%;margin:0;overflow:hidden}
body{background:#050914 url("background.jpg") center/cover no-repeat fixed!important}
.page{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:7vh 16px 3vh}
.brand{font-size:11px;letter-spacing:.28em;color:#9db8d8;margin-bottom:10px;text-align:center}
.title{margin:0 0 6px;text-align:center;font-size:clamp(22px,3.2vw,34px);font-weight:800;letter-spacing:.08em}
.title b{color:#8fc8ff}
.sub{font-size:11px;color:#8fa6be;text-align:center;margin-bottom:18px}
.panel{width:min(680px,92vw);padding:20px;border:1px solid rgba(115,170,255,.24);border-radius:14px;background:rgba(2,8,17,.78);box-shadow:0 14px 40px rgba(0,0,0,.42)}
#state{font-size:20px;font-weight:700;margin-bottom:10px}
#out{white-space:pre-wrap;font:12px/1.5 Consolas,monospace;color:#e9f2ff;max-height:52vh;overflow:auto}
.ok{color:#bfe7ff}.bad{color:#ffb4aa}.warn{color:#ffe39a}
.spinner{width:34px;height:34px;margin:8px auto 14px;border:3px solid rgba(143,200,255,.18);border-top-color:#8fc8ff;border-radius:50%;animation:spin .8s linear infinite}
body.done .spinner{display:none}
@keyframes spin{to{transform:rotate(360deg)}}
</style>

<style id="offline-bg-fix">html,body{min-height:100%;background-color:#050914!important;}body{background-image:url("background.jpg")!important;background-position:center center!important;background-size:cover!important;background-repeat:no-repeat!important;background-attachment:fixed!important;}</style>
</head>
<body>
<div class="page">
  <div class="brand">OFFLINE PS4 PROJECT</div>
  <h1 class="title">AMINE PS4 <b>PS4</b></h1>
  <div class="sub">13.02 · 13.50 · 13.52 · Exact local cache</div>
  <div class="spinner"></div>
  <div class="panel">
    <div id="state">Starting...</div>
    <div id="out"></div>
  </div>
</div>
<script type="module">
import "./jb.js";
</script>

<style id="goldhen-status-style">
#goldhen-status{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:2147483647;display:none;min-width:280px;max-width:88vw;padding:16px 22px;border-radius:14px;background:rgba(2,8,17,.95);border:1px solid rgba(143,200,255,.35);box-shadow:0 8px 28px rgba(0,0,0,.45);color:#eaf4ff;font:700 20px/1.3 Arial,sans-serif;text-align:center;direction:rtl;pointer-events:none}
#goldhen-status.ok{display:block;border-color:rgba(80,210,140,.6)}#goldhen-status.bad{display:block;border-color:rgba(255,100,100,.6)}
</style>
<div id="goldhen-status" aria-live="polite"></div>
<script>
(function(){
  'use strict';
  var box=document.getElementById('goldhen-status');
  if(!box)return;
  function show(ok){box.textContent=ok?'تم التفعيل بنجاح':'فشل التفعيل';box.className=ok?'ok':'bad';}
  function watch(node, successRe, failRe){
    if(!node)return;
    function check(){var t=(node.textContent||'');if(failRe&&failRe.test(t))show(false);else if(successRe.test(t))show(true);}
    check();
    try{new MutationObserver(check).observe(node,{childList:true,subtree:true,characterData:true});}catch(e){}
  }
  var path=location.pathname;
  if(/\/900\//.test(path)) watch(document.getElementById('console'),/GoldHEN\s+Loaded|GoldHEN.*!/i,/Unhandled (?:error|rejection)|failed/i);
  else if(/\/505_960\//.test(path)) watch(document.getElementById('console'),/Tekan tombol PS untuk keluar|Sudah terjailbreak|BERHASIL!/i,/Gagal load HEN|Error di Kernel Exploit|restart PS4/i);
  else if(/\/1000_1102\//.test(path)) watch(document.getElementById('console'),/Tekan tombol PS untuk keluar|Achieved jailbreak/i,/Error|Unsupported console/i);
  else if(/\/1150-1300\//.test(path)) watch(document.getElementById('state'),/^BERHASIL\b/i,/^FAILED|^REBOOT THE CONSOLE|^see log/i);
  else if(/\/1302-1352\//.test(path)){
    function check(){var c=document.body.className||'';if(/\bdone\b/.test(c))show(true);else if(/\bfail\b/.test(c))show(false);}
    check();
    try{new MutationObserver(check).observe(document.body,{attributes:true,attributeFilter:['class']});}catch(e){}
  }
})();
</script>
</body>
</html>
