<!doctype html>
<html lang="en" manifest="cache.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Amine PS4 PS4</title>
<link rel="stylesheet" href="../theme.css">
<link rel="stylesheet" href="../unified-theme.css">
<style>
html,body{width:100%;height:100%;margin:0;overflow:hidden}
body{background:#050914 url("background.jpg") center/cover no-repeat fixed!important}
.page{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:7vh 16px 3vh}
.brand{font-size:11px;letter-spacing:.28em;color:#9db8d8;margin-bottom:10px;text-align:center}
.title{margin:0 0 6px;text-align:center;font-size:clamp(22px,3.2vw,34px);font-weight:800;letter-spacing:.08em}
.title b{color:#8fc8ff}
.sub{font-size:11px;color:#8fa6be;text-align:center;margin-bottom:18px}
.panel{width:min(680px,92vw);padding:20px;border:1px solid rgba(115,170,255,.24);border-radius:14px;background:rgba(2,8,17,.78);box-shadow:0 14px 40px rgba(0,0,0,.42)}
#state{font-size:20px;font-weight:700;margin-bottom:10px}
#out{white-space:pre-wrap;font:12px/1.5 Consolas,monospace;color:#e9f2ff;max-height:52vh;overflow:auto}
.ok{color:#bfe7ff}.bad{color:#ffb4aa}.warn{color:#ffe39a}
.cache-box{margin:0 0 16px;padding:12px;border:1px solid rgba(143,200,255,.22);border-radius:10px;background:rgba(5,15,30,.72)}
.cache-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px;color:#cfe5ff;font-size:14px}
#cache-percent{font-weight:800;font-variant-numeric:tabular-nums;color:#8fc8ff}
.cache-track{height:12px;width:100%;overflow:hidden;border-radius:99px;background:rgba(143,200,255,.15);border:1px solid rgba(143,200,255,.18)}
#cache-fill{height:100%;width:0%;border-radius:99px;background:linear-gradient(90deg,#3988ff,#8fc8ff);transition:width .18s ease}
#cache-detail{margin-top:7px;font-size:11px;color:#8fa6be;white-space:pre-wrap}
.spinner{width:34px;height:34px;margin:8px auto 14px;border:3px solid rgba(143,200,255,.18);border-top-color:#8fc8ff;border-radius:50%;animation:spin .8s linear infinite}
body.done .spinner{display:none}
@keyframes spin{to{transform:rotate(360deg)}}
</style>

<style id="offline-bg-fix">html,body{min-height:100%;background-color:#050914!important;}body{background-image:url("background.jpg")!important;background-position:center center!important;background-size:cover!important;background-repeat:no-repeat!important;background-attachment:fixed!important;}</style>
</head>
<body>
<div class="page">
  <div class="brand">OFFLINE PS4 PROJECT</div>
  <h1 class="title">AMINE PS4 <b>PS4</b></h1>
  <div class="sub">13.02 · 13.50 · 13.52 · Exact local cache</div>
  <div class="spinner"></div>
  <div class="panel">
    <div class="cache-box" aria-live="polite">
      <div class="cache-row"><span id="cache-label">Cache: waiting for browser</span><span id="cache-percent">0%</span></div>
      <div class="cache-track"><div id="cache-fill"></div></div>
      <div id="cache-detail">Waiting for offline cache events…</div>
    </div>
    <div id="state">Starting...</div>
    <div id="out"></div>
  </div>
</div>
<script>
(function(){
  var label=document.getElementById('cache-label');
  var percent=document.getElementById('cache-percent');
  var fill=document.getElementById('cache-fill');
  var detail=document.getElementById('cache-detail');
  var app=window.applicationCache;
  function setProgress(n,text,detailText){
    n=Math.max(0,Math.min(100,Math.round(n)));
    percent.textContent=n+'%'; fill.style.width=n+'%';
    if(text) label.textContent=text;
    if(detailText) detail.textContent=detailText;
  }
  if(!app){setProgress(0,'Cache API unavailable','This browser does not expose the Application Cache API.');return;}
  app.addEventListener('checking',function(){setProgress(0,'Checking cache','Checking whether a cached copy is available…');});
  app.addEventListener('downloading',function(){setProgress(0,'Downloading cache','Downloading files for offline use…');});
  app.addEventListener('progress',function(e){
    var total=Number(e.total)||0, loaded=Number(e.loaded)||0;
    if(total>0){setProgress(loaded/total*100,'Downloading cache',loaded+' of '+total+' files');}
    else {setProgress(0,'Downloading cache','Downloaded '+loaded+' files…');}
  });
  app.addEventListener('cached',function(){setProgress(100,'Offline cache ready','All manifest resources were cached.');});
  app.addEventListener('noupdate',function(){setProgress(100,'Offline cache ready','The browser already has the current cache.');});
  app.addEventListener('updateready',function(){setProgress(100,'Offline cache updated','A new cache is ready. Reload the page to use it.');});
  app.addEventListener('obsolete',function(){setProgress(0,'Cache obsolete','The browser marked this cache as obsolete.');});
  app.addEventListener('error',function(){setProgress(0,'Cache error','The browser could not complete offline caching. Check the manifest and resource paths.');});
  if(app.status===app.UPDATEREADY){setProgress(100,'Offline cache updated','A new cache is ready. Reload the page to use it.');}
  else if(app.status===app.IDLE){setProgress(100,'Offline cache available','The browser reports an existing cache.');}
})();
</script>

<script type="module">
import "./jb.js";
</script>

<style>
#goldhen-status{display:none;position:fixed;inset:0;z-index:2147483647;align-items:center;justify-content:center;pointer-events:none;font-family:Arial,sans-serif}
#goldhen-status span{padding:18px 34px;border-radius:14px;background:rgba(0,0,0,.86);border:1px solid rgba(255,255,255,.22);color:#fff;font-size:clamp(22px,4vw,42px);font-weight:700;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.45)}
</style>
<div id="goldhen-status"><span></span></div>
<script>
window.showGoldHENStatus=function(ok){try{var e=document.getElementById('goldhen-status');if(!e)return;e.firstElementChild.textContent=ok?'تم التفعيل بنجاح':'فشل التفعيل';e.style.display='flex';}catch(_){} };
</script>
</body>
</html>
