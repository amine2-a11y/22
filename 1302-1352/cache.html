<html manifest="cache.appcache">
<head>
<title>AMINE PS4 · PS4 Exploit</title>

<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{background:linear-gradient(rgba(0,8,18,.08),rgba(0,8,18,.22)),url("amine_ps4_background.jpg") center/cover no-repeat fixed;color:#f1ffd9}
.info{position:absolute;top:45%;left:50%;transform:translate(-50%,-50%);font:700 22px monospace;text-align:center;letter-spacing:2px;text-shadow:0 2px 10px #152415}
body:after{content:"";position:absolute;bottom:8%;left:0;right:0;text-align:center;font:700 12px monospace;letter-spacing:5px;opacity:.35}
</style>
<script>
history.replaceState(null, null, 'index.html');
var histlength = history.length;
history.go(-histlength);

function DLProgress(e) {
    var pct = Math.round(e.loaded / e.total * 100);
    msgs.innerHTML = "AMINE PS4 &middot; Installing ... " + pct + "%";
}

function DisplayCacheProgress() {
    setTimeout(function () {
        msgs.innerHTML = "AMINE PS4 &middot; Cache OK";
    }, 2000);
    setTimeout(function () {
        location.reload();
    }, 3000);
}

window.applicationCache.addEventListener("progress",    DLProgress,           false);
window.applicationCache.oncached     = function (e) { DisplayCacheProgress(); };
window.applicationCache.onupdateready = function (e) { DisplayCacheProgress(); };
</script>
</head>
<body>
<div id="msgs" class="info"></div>
</body>
</html>
