<!doctype html>
<html lang="en" manifest="cache.appcache">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Amine PS4 Aurora · 11.50–13.00</title><link rel="stylesheet" href="../amine-aurora.css">
</head><body><main class="aurora-shell">
<header class="aurora-brand"><strong>AMINE <span>PS4</span></strong><span class="aurora-chip">AURORA · OFFLINE HUB</span></header>
<section class="aurora-hero"><div class="aurora-kicker">FIRMWARE EXPLOIT PROFILE</div><h1 class="aurora-title">PS4 <span style="color:var(--accent)">11.50 — 13.00</span></h1><p class="aurora-sub">The original firmware detection and exploit routines remain in place.</p></section><section class="aurora-card"><div id="state">Detecting firmware…</div><div id="det"></div><div id="cache" aria-live="polite"></div></section>
<footer class="aurora-footer">AMINE PS4 · AURORA INTERFACE</footer>
</main>
<script src="./goldhen-status.js"></script>
<script>
(function () {
    var stateEl = document.getElementById("state");
    var detEl = document.getElementById("det");
    var cacheEl = document.getElementById("cache");
    function setState(t, c) { stateEl.textContent = t; stateEl.className = c || ""; }
    function setCache(t, ok) { cacheEl.textContent = t; cacheEl.className = ok ? "cacheok" : ""; }
    var params = new URLSearchParams(location.search);

    var key = null, fwnum = null;
    var m = /PlayStation\s+4[\/ ](\d+)\.(\d+)/.exec(navigator.userAgent);
    if (m) {
        var major = parseInt(m[1], 10);
        var minor = parseInt(m[2], 10);
        if (!Number.isFinite(major) || !Number.isFinite(minor)) {
            key = null;
        } else {
            var ms = String(minor).padStart(2, "0");
            key = major + "." + ms;
            fwnum = major * 100 + minor;
        }
    }
    var bug = null, why = "";
    var profiles = {
        "11.50": { bug: "lapse", patch: "patches/1150.bin" },
        "12.00": { bug: "lapse", patch: "patches/1200.bin" },
        "12.02": { bug: "lapse", patch: "patches/1200.bin" },
        "12.50": { bug: "poops", patch: "patches/1250.bin" },
        "12.52": { bug: "poops", patch: "patches/1250.bin" },
        "13.00": { bug: "poops", patch: "patches/1300.bin" }
    };
    var profile = key ? profiles[key] : null;
    if (!key) {
        why = "user-agent is not a PlayStation 4";
    } else if (!profile) {
        why = key + " -- no exact firmware profile; refusing to guess";
    } else {
        bug = profile.bug;
        why = key + " -- exact profile";
    }
    detEl.innerHTML = "firmware <b>" + (key || "unknown") + "</b>"
        + " &middot; bug <b>" + (bug || "none") + "</b> &middot; " + why;

    if (!bug) { setState("UNSUPPORTED FIRMWARE", "bad"); return; }

    var target = (bug === "lapse" ? "run_lapse.html" : "run_poops.html")
        + location.search;
    var started = false;
    function go() {
        if (started) return;
        started = true;
        setState("preflight passed — loading " + bug + " chain...", "warn");
        location.replace(target);
    }
    function failPreflight(msg) {
        started = true;
        setState("PRE-FLIGHT STOPPED", "bad");
        setCache(msg, false);
    }
    function checkLocal(path, cb) {
        var done = false;
        var x = new XMLHttpRequest();
        function finish(ok) {
            if (done) return;
            done = true;
            try { x.abort(); } catch (e) {}
            cb(!!ok);
        }
        x.open("GET", path, true);
        x.timeout = 1800;
        x.onreadystatechange = function () {
            if (x.readyState !== 4) return;
            // In PS4 Application Cache, a cached local resource may report
            // status 0. Treat that as available; never wait indefinitely.
            finish(x.status === 0 || (x.status >= 200 && x.status < 400));
        };
        x.ontimeout = function () { finish(false); };
        x.onerror = function () { finish(false); };
        try { x.send(null); } catch (e) { finish(false); }
    }
    function preflight(cb) {
        if (!profile || !key) return cb(false, "No exact firmware profile");
        // Verify that the local metadata and the exact patch asset exist before dispatch.
        checkLocal("ps4_offsets.js", function (a) {
            if (!a) return cb(false, "ps4_offsets.js unavailable in cache");
            checkLocal(profile.patch, function (b) {
                if (!b) return cb(false, profile.patch + " unavailable in cache");
                checkLocal(bug === "lapse" ? "run_lapse.html" : "run_poops.html", function (c) {
                    if (!c) return cb(false, "chain entry unavailable in cache");
                    cb(true, "preflight passed");
                });
            });
        });
    }

    function safeGo() {
        if (started) return;
        if (!navigator.onLine) {
            setState("offline — starting " + bug + "...", "warn");
            setTimeout(go, 60);
            return;
        }
        setState("checking local assets...", "warn");
        preflight(function (ok, msg) {
            if (ok) go();
            else failPreflight(msg);
        });
    }

    function waitForTap(msg, action) {
        setState(msg, "warn");
        var fired = false;
        var timer = null;
        function fire() {
            if (fired) return;
            fired = true;
            if (timer) clearTimeout(timer);
            window.removeEventListener("click", fire);
            window.removeEventListener("keydown", fire);
            action();
        }
        window.addEventListener("click", fire);
        window.addEventListener("keydown", fire);
        // Offline must never depend on user input. Continue automatically.
        timer = setTimeout(fire, 900);
    }

    var ac = window.applicationCache;
    // OFFLINE FAST PATH: when the profile is already cached, dispatch directly.
    // Do not perform XHR preflight checks on PS4 offline; WebKit can report cached
    // resources with status 0/timeout and those checks can leave the UI waiting.
    if (!navigator.onLine && ac && ac.status === ac.IDLE) {
        setCache("offline cache ready", true);
        setTimeout(safeGo, 80);
    } else if (!ac || !document.documentElement.hasAttribute("manifest")) {
        safeGo();
    } else if (ac.status === ac.IDLE) {
        setCache(navigator.onLine ? "cached -- offline ready" : "offline -- from cache", true);
        safeGo();
    } else if (!navigator.onLine && ac.status === ac.UNCACHED) {
        // No cache exists yet: do not pretend Offline is ready.
        failPreflight("offline cache not initialized -- open this profile once online");
    } else if (!navigator.onLine) {
        setCache("offline cache -- using stored copy", true);
        // Give WebKit a moment to expose the cached resources, then dispatch.
        setTimeout(safeGo, 250);
    } else if (ac.status === ac.UPDATEREADY) {
        setCache("cached", true);
        safeGo();
    } else if (ac.status === ac.UPDATEREADY) {
        try { ac.swapCache(); } catch (e) {}
        setCache("update downloaded", true);
        setTimeout(function () { location.reload(); }, 80);
    } else {
        setCache("checking cache...");
        ac.addEventListener("downloading",
            function () { setCache("caching for offline (first run)..."); }, false);
        ac.addEventListener("progress", function (e) {
            if (e && e.total)
                setCache("caching " + Math.round((e.loaded / e.total) * 100) + "%");
        }, false);

        ac.addEventListener("cached", function () {
            setCache("cached for offline use", true);
            waitForTap("CACHED (first run) -- Tekan tombol Enter  X/O", safeGo);
        }, false);
        ac.addEventListener("updateready", function () {
            try { ac.swapCache(); } catch (e) {}
            setCache("update downloaded", true);
            waitForTap("UPDATE READY -- Tekan tombol Enter  X/O",
                       function () { location.reload(); });
        }, false);

        ac.addEventListener("noupdate", function () {
            setCache("cached -- offline ready", true);
            safeGo();
        }, false);
        ac.addEventListener("error", function () {
            setCache("cache unavailable — trying local chain", false);
            setTimeout(safeGo, 80);
        }, false);
        ac.addEventListener("obsolete", function () {
            setCache("cache obsolete — trying local chain", false);
            setTimeout(safeGo, 80);
        }, false);
    }
})();
</script>
<script>

/* Firmware Auto Start dispatcher — lightweight, one-shot */
(function () {
  "use strict";
  function fw() {
    var t = (document.body && document.body.innerText) || "";
    var m = t.match(/\b(9\.00|9\.03|9\.04|9\.50|9\.60|10\.00|10\.01|10\.50|10\.70|10\.71|11\.00|11\.02|11\.50|11\.51|11\.52|11\.60|11\.70|11\.80|12\.00|12\.50|12\.70|12\.71|12\.72|13\.00)\b/);
    return m ? m[1] : null;
  }
  function start() {
    var selectors = [
      "#startJailbreak", "#start-jailbreak", "#start", "#jeilbrek",
      "[data-action='jailbreak']",
      "button[id*='start' i][id*='jailbreak' i]",
      "a[id*='start' i][id*='jailbreak' i]"
    ];
    for (var i=0;i<selectors.length;i++) {
      var e=document.querySelector(selectors[i]);
      if(e && !e.disabled){ try{e.click(); return true;}catch(_){} }
    }
    return false;
  }
  window.FirmwareAutoStart = { firmware: fw(), start: start };
  function boot(){
    if (start()) return;
    setTimeout(start, 120);
  }
  if(document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot, false);
  else boot();
})();

</script>
</body></html>
