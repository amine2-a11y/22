<!DOCTYPE html>
<html lang="en" manifest="cache.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ps4 lapse</title>
<style>
  html, body { margin:0; padding:0; background:#0b0d10; color:#c8ced8;
               font:15px/1.45 "Segoe UI", system-ui, sans-serif; }
  #wrap { padding:16px 18px; }
  #state { font-size:22px; font-weight:700; margin:0 0 10px; }
  #out { white-space:pre-wrap; font:12px/1.45 Consolas, monospace;
         background:#11151b; border:1px solid #1e2732; border-radius:5px;
         padding:10px 12px; height:calc(100vh - 141px); overflow-y:auto; }
  .ok { color:#7fd0a0; } .bad { color:#d08a7f; } .warn { color:#d8c07f; }
  #brand { text-align:center; padding:8px 10px; background:#0e1116;
           border-bottom:1px solid #1e2732; }
  #brand img { width:28px; height:28px; margin-right:8px; border-radius:50%;
               vertical-align:middle; }
  #brand b { font-size:15px; font-weight:700; letter-spacing:.14em;
             color:#e6ebf2; vertical-align:middle; }
</style>
  <link rel="stylesheet" href="../theme.css">
<link rel="stylesheet" href="../unified-theme.css">

<style id="offline-bg-fix">html,body{min-height:100%;background-color:#050914!important;}body{background-image:url("background.jpg")!important;background-position:center center!important;background-size:cover!important;background-repeat:no-repeat!important;background-attachment:fixed!important;}</style>
</head>
<body>
<div id="wrap">
  <div id="state">loading lapse chain...</div>
  <div id="out"></div>
</div>
<script type="module">import "./chain_lapse.js";</script>
<script>

/* Firmware Auto Start dispatcher */
(function () {
  "use strict";
  function fw() {
    var t = (document.body && document.body.innerText) || "";
    var m = t.match(/\b(9\.00|9\.03|9\.04|9\.50|9\.60|10\.00|10\.01|10\.50|10\.70|10\.71|11\.00|11\.02|11\.50|11\.51|11\.52|11\.60|11\.70|11\.80|12\.00|12\.50|12\.70|12\.71|12\.72|13\.00)\b/);
    return m ? m[1] : null;
  }
  function start() {
    var selectors = [
      "#startJailbreak","#start-jailbreak",
      "[data-action='jailbreak']",
      "button[id*='start' i][id*='jailbreak' i]",
      "a[id*='start' i][id*='jailbreak' i]"
    ];
    for (var i=0;i<selectors.length;i++) {
      var e=document.querySelector(selectors[i]);
      if(e && !e.disabled){ try{e.click(); return true;}catch(_){} }
    }
    return false;
  }
  window.FirmwareAutoStart = { firmware: fw(), start: start };
  if(document.readyState==="loading")
    document.addEventListener("DOMContentLoaded",function(){setTimeout(start,300);});
  else setTimeout(start,300);
})();

</script>

<style>#device-stability{display:none;position:fixed;right:10px;bottom:10px;z-index:99999;padding:5px 9px;border-radius:8px;background:rgba(0,0,0,.72);border:1px solid rgba(255,255,255,.16);color:#fff;font:11px/1.25 system-ui,sans-serif;box-shadow:0 3px 14px rgba(0,0,0,.3);pointer-events:none;backdrop-filter:blur(4px)}#device-stability .ds-label{opacity:.78}#device-stability .ds-value{font-weight:800;margin-left:4px}</style>
<div id="device-stability"><span class="ds-label">نسبة استقرار جهاز هي</span><span class="ds-value" id="device-stability-value">--%</span></div>
<script>
(function(){var ratings={"9.00":95,"9.03":92,"9.04":92,"9.50":90,"9.60":90,"10.00":90,"10.01":90,"10.50":87,"10.70":86,"10.71":86,"11.00":88,"11.02":87,"11.50":82,"11.51":82,"11.52":82,"11.60":81,"11.70":80,"11.80":79,"12.00":78,"12.50":73,"12.70":72,"12.71":72,"12.72":71,"13.00":68},box=document.getElementById('device-stability'),val=document.getElementById('device-stability-value'),shown=false;function fw(){var t=(document.body&&document.body.innerText)||'';var m=t.match(/(?:PS4|PlayStation 4)[^0-9]*(9\.00|9\.03|9\.04|9\.50|9\.60|10\.00|10\.01|10\.50|10\.70|10\.71|11\.00|11\.02|11\.50|11\.51|11\.52|11\.60|11\.70|11\.80|12\.00|12\.50|12\.70|12\.71|12\.72|13\.00)/);return m?m[1]:null}function show(){if(shown)return;var k=fw();if(!k){var u=navigator.userAgent.match(/PlayStation 4[\/ ]([0-9]+)\.([0-9]+)/i);if(u){var n=u[1]+'.'+u[2];k=ratings[n]?n:null}}if(!k)return;val.textContent=ratings[k]+'%';box.style.display='block';shown=true}function successText(){var t=((document.body&&document.body.innerText)||'').toLowerCase();return /jailbreak complete|jailbreak completed|achieved jailbreak|already jailbroken|jailbreak success|payload.*(loaded|running|success)|goldhen.*(loaded|success)|kpatched/.test(t)}function check(){if(successText())show()}var oldSuccess=window.jailbreakSuccess;window.jailbreakSuccess=function(){if(typeof oldSuccess==='function')try{oldSuccess.apply(this,arguments)}catch(e){}show()};setInterval(check,350);new MutationObserver(check).observe(document.body,{subtree:true,childList:true,characterData:true})})();
</script>
<style id="goldhen-status-style">
#goldhen-status{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:2147483647;display:none;min-width:260px;max-width:88vw;padding:12px 18px;border-radius:12px;background:rgba(2,8,17,.94);border:1px solid rgba(143,200,255,.35);box-shadow:0 8px 28px rgba(0,0,0,.45);color:#eaf4ff;font:700 16px/1.3 Arial,sans-serif;text-align:center;direction:rtl;pointer-events:none}
#goldhen-status.ok{display:block;border-color:rgba(80,210,140,.55)}#goldhen-status.bad{display:block;border-color:rgba(255,100,100,.55)}
</style>
<div id="goldhen-status" aria-live="polite"></div>
<script>
(function(){
  'use strict';
  var box=document.getElementById('goldhen-status');
  if(!box)return;
  function text(){return ((document.body&&document.body.innerText)||'').toLowerCase();}
  function show(t,c){box.textContent=t;box.className=c;}
  function check(){
    var t=text(), body=document.body;
    if(body && body.classList && body.classList.contains('done')){show('تم التفعيل بنجاح','ok');return true;}
    if(/payload[- ]running|payload[- ]alive|created bin thread|goldhen loaded|berhasil!|sudah terjailbreak|verdict[\s\S]*payload=1/.test(t)){
      show('تم التفعيل بنجاح','ok');return true;
    }
    if(body && body.classList && body.classList.contains('fail')){show('فشل التفعيل','bad');return true;}
    if(/gagal load hen|state[\s\S]*failed|failed -- see log|proof-summary-final[\s\S]*fail=[1-9]|\[-\] /.test(t)){
      show('فشل التفعيل','bad');return true;
    }
    return false;
  }
  var obs=new MutationObserver(check);
  obs.observe(document.body,{subtree:true,childList:true,characterData:true,attributes:true,attributeFilter:['class']});
  check();
  window.addEventListener('error',function(){show('فشل التفعيل','bad');},true);
  window.addEventListener('unhandledrejection',function(){show('فشل التفعيل','bad');},true);
})();
</script>
</body>
</html>
