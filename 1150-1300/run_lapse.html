/* Firmware Auto Start dispatcher */
(function () {
  "use strict";
  function fw() {
    var t = (document.body && document.body.innerText) || "";
    var m = t.match(/\b(9\.00|9\.03|9\.04|9\.50|9\.60|10\.00|10\.01|10\.50|10\.70|10\.71|11\.00|11\.02|11\.50|11\.51|11\.52|11\.60|11\.70|11\.80|12\.00|12\.50|12\.70|12\.71|12\.72|13\.00)\b/);
    return m ? m[1] : null;
  }
  function start() {
    var selectors = [
      "#startJailbreak","#start-jailbreak",
      "[data-action='jailbreak']",
      "button[id*='start' i][id*='jailbreak' i]",
      "a[id*='start' i][id*='jailbreak' i]"
    ];
    for (var i=0;i<selectors.length;i++) {
      var e=document.querySelector(selectors[i]);
      if(e && !e.disabled){ try{e.click(); return true;}catch(_){} }
    }
    return false;
  }
  window.FirmwareAutoStart = { firmware: fw(), start: start };
  if(document.readyState==="loading")
    document.addEventListener("DOMContentLoaded",function(){setTimeout(start,300);});
  else setTimeout(start,300);
})();

</script>

<script>(function(){
'use strict';
var KEY='amine_lion_activation_pending_v2';

  return /jailbreak|activate|exploit|goldhen|start.?jb/.test(s);
}
document.addEventListener('click',function(e){
  var el=e.target&&e.target.closest ? e.target.closest('button,a,[role="button"]') : e.target;
  if(isActivation(el)){ try{sessionStorage.setItem(KEY,'1')}catch(_){} }
},true);
function bootLion(){

      sessionStorage.removeItem(KEY);
      setTimeout(function(){ if(window.OfflineLion) window.OfflineLion.start(); },120);
    }

}
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',bootLion); else bootLion();
