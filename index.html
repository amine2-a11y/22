<!doctype html><html lang="en" manifest="cache.appcache"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Amine PS4 Aurora</title><link rel="stylesheet" href="amine-aurora.css"><style>
body{display:grid;place-items:center;padding:18px}.launch{width:min(650px,94vw);padding:30px;border:1px solid var(--line);border-radius:22px;background:var(--panel);text-align:center;box-shadow:0 24px 70px #0009}.launch .aurora-title{font-size:clamp(30px,7vw,48px)}.bar{height:7px;margin:20px 0 8px;border-radius:20px;background:#fff2;overflow:hidden}.bar i{display:block;width:0;height:100%;background:var(--accent);transition:width .2s}.manual{display:none;margin-top:20px}.manual button{margin:5px}
</style></head><body><main class="launch"><div class="aurora-kicker">OFFLINE EXPLOIT ENVIRONMENT</div><h1 class="aurora-title">AMINE <span style="color:var(--accent)">PS4</span></h1><p class="aurora-sub">A fresh unified interface · Aurora Edition</p><p id="msg" class="aurora-status">Detecting system firmware…</p><div class="bar"><i id="fill"></i></div><section id="manual" class="manual"><p class="aurora-sub">Choose firmware manually if detection is unavailable.</p><button data-go="900/index.html">9.00</button><button data-go="505_960/index.html">5.05–9.60</button><button data-go="1000_1102/index.html">10.00–11.02</button><button data-go="1150-1300/index.html">11.50–13.00</button><button data-go="1302-1352/index.html">13.02–13.52</button><button data-go="14.00/index.html">14.00–14.02</button></section><div class="aurora-footer">LOCAL FILES · SINGLE TAB · OFFLINE CACHE</div></main>
<script>(function(){var m=document.getElementById('msg'),f=document.getElementById('fill'),u=document.getElementById('manual');function say(t){m.textContent=t;f.style.width='100%'}function ver(){var x=/PlayStation\s+4[\/ ](\d+)\.(\d+)/.exec(navigator.userAgent);return x?parseFloat(x[1]+'.'+x[2]):null}function dest(v){if(v===9)return'900/index.html';if(v>=5&&v<=9.6)return'505_960/index.html';if(v>=10&&v<=11.02)return'1000_1102/index.html';if([11.5,12,12.02,12.5,12.52,13].indexOf(v)>=0)return'1150-1300/index.html';if([13.02,13.04,13.5,13.52].indexOf(v)>=0)return'1302-1352/index.html';if(v===14||v===14.02)return'14.00/index.html';return null}var v=ver(),d=v===null?null:dest(v);if(d){say('Firmware '+v.toFixed(2)+' detected · opening local profile');setTimeout(function(){location.replace(d)},500)}else{say(v===null?'Firmware detection unavailable.':'Firmware not included in this build.');u.style.display='block'}u.addEventListener('click',function(e){var b=e.target.closest('button[data-go]');if(b)location.href=b.getAttribute('data-go')})})();</script></body></html>
