<script>
(function(){
"use strict";
var msg=document.getElementById("msg"),fill=document.getElementById("fill");
function set(t,p){msg.textContent=t;fill.style.width=Math.max(0,Math.min(100,p||0))+"%";}
function fw(){
 var m=/PlayStation\s+4[\/ ](\d+)\.(\d+)/.exec(navigator.userAgent);
 if(!m)return null;
 return parseFloat(m[1]+"."+m[2]);
}
var f=fw(), target=null;
var profileLabel="";
if(f!==null){
 if(Math.abs(f-9.00)<.001){target="900/index.html";profileLabel="9.00";}
 else if(f>=5.00 && f<=9.60){target="505_960/index.html";profileLabel="5.05–9.60";}
 else if(f>=10.00 && f<=11.02){target="1000_1102/index.html";profileLabel="10.00–11.02";}
 else if([11.50,12.00,12.02,12.50,12.52,13.00].some(function(v){return Math.abs(f-v)<.001;})){target="1150-1300/index.html";profileLabel="11.50–13.00";}
 else if([13.02,13.04,13.50,13.52].some(function(v){return Math.abs(f-v)<.001;})){target="1302-1352/index.html";profileLabel="13.02–13.52";}
}
set(f===null?"PS4 firmware not detected":"Firmware "+f.toFixed(2)+(profileLabel?" · Cache "+profileLabel:""),35);
setTimeout(function(){
 if(target){set("Opening local cache profile "+profileLabel+"...",100);setTimeout(function(){location.replace(target);},120);}
 else set("Firmware profile not included in this build.",100);
},220);
})();
</script>

<script>(function(){
'use strict';
var KEY='amine_lion_activation_pending_v2';
function isActivation(el){
  if(!el) return false;
  var s=((el.innerText||el.textContent||'')+' '+(el.getAttribute&&el.getAttribute('onclick')||'')+' '+(el.id||'')+' '+(el.className||'')).toLowerCase();
  return /jailbreak|activate|exploit|goldhen|start.?jb/.test(s);
}
document.addEventListener('click',function(e){
  var el=e.target&&e.target.closest ? e.target.closest('button,a,[role="button"]') : e.target;
  if(isActivation(el)){ try{sessionStorage.setItem(KEY,'1')}catch(_){} }
},true);
function bootLion(){
  try{
    if(sessionStorage.getItem(KEY)==='1'){
      sessionStorage.removeItem(KEY);
      setTimeout(function(){ if(window.OfflineLion) window.OfflineLion.start(); },120);
    }
  }catch(_){}
}
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',bootLion); else bootLion();
})();</script>

<script id="lion-pro-v4-js">
(function(){
 if(window.__AmineLionProV4)return; window.__AmineLionProV4=1;
 function ready(fn){if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',fn);else fn();}
 ready(function(){
  var root=document.getElementById('amine-lion-pro'); if(!root)return;
  var label=root.querySelector('.amine-lion-label'), pct=root.querySelector('.amine-lion-pct'), fill=root.querySelector('.amine-lion-fill'), timer=null, val=0, active=false;
  function paint(n,t){val=Math.max(0,Math.min(100,n));pct.textContent=Math.round(val)+'%';fill.style.width=val+'%';if(t)label.textContent=t;}
  function start(){if(active)return;active=true;root.className='on';root.classList.remove('success','fail');paint(4,'السبع يجري — فحص الملفات');clearInterval(timer);timer=setInterval(function(){if(val<90)paint(val+(val<30?4:val<65?2:0.7),val<30?'السبع يجري — فحص الملفات':val<65?'السبع يجري — تفعيل النظام':'السبع يجري — انتظار النتيجة');},250);}
  function finish(ok){if(!active)return;clearInterval(timer);active=false;root.className='on '+(ok?'success':'fail');paint(100,ok?'السبع فرحان — تم التفعيل بنجاح':'السبع زعفان — فشل التفعيل');setTimeout(function(){root.className='';},2600);}
  window.OfflineLion={start:start,success:function(){finish(true)},fail:function(){finish(false)}};
  // Existing progress UI, if present.
  setInterval(function(){var a=document.getElementById('activation-progress');if(!a)return;if(a.classList.contains('running'))start();if(a.classList.contains('done'))finish(true);if(a.classList.contains('error'))finish(false);},150);
  // Start from the activation button without changing its existing action.
  var sels=['#startJailbreak','#start-jailbreak','#start','#jeilbrek','[data-action="jailbreak"]','button[id*="jailbreak" i]','a[id*="jailbreak" i]','button[onclick*="jailbreak" i]'];
  sels.forEach(function(sel){try{document.querySelectorAll(sel).forEach(function(e){if(e.__lion4)return;e.__lion4=1;e.addEventListener('click',start,true);});}catch(e){}});
  // If the page reloads as part of the existing activation flow, resume visually.
  try{if(sessionStorage.getItem('amineLionPending')==='1'){sessionStorage.removeItem('amineLionPending');setTimeout(start,180);}}catch(e){}
  document.addEventListener('click',function(e){var el=e.target;while(el&&el!==document){if(el.matches&&sels.some(function(s){try{return el.matches(s)}catch(_){return false}})){try{sessionStorage.setItem('amineLionPending','1')}catch(_){};start();break}el=el.parentNode;}},true);
 });
})();
</script>

<script id="lion-activation-replace">
(function(){
  if(window.__AmineLionActivationClean)return; window.__AmineLionActivationClean=1;
  var src='assets/lion-run-transparent.gif';
  var selectors=['#startJailbreak','#start-jailbreak','#start','#jeilbrek','[data-action="jailbreak"]','button[id*="jailbreak" i]','a[id*="jailbreak" i]'];
  function isAct(el){if(!el||!el.matches)return false; for(var i=0;i<selectors.length;i++){try{if(el.matches(selectors[i]))return true;}catch(e){}} return false;}
  function apply(){
    for(var i=0;i<selectors.length;i++){var els=[];try{els=document.querySelectorAll(selectors[i]);}catch(e){} for(var j=0;j<els.length;j++){var el=els[j]; if(el.getAttribute('data-lion-replaced')==='1')continue; var img=document.createElement('img'); img.className='activation-lion-img'; img.src=src; img.alt=''; img.setAttribute('aria-hidden','true'); el.innerHTML=''; el.appendChild(img); el.classList.add('activation-lion'); el.setAttribute('data-lion-replaced','1');}}
  }
  function go(){apply(); setTimeout(apply,300); setTimeout(apply,900);}
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',go);else go();
  setInterval(apply,1200);
})();
</script>
