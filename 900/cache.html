<!doctype html>
<html manifest="psfree_lapse.cache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PSFree-Lapse — Installing Cache</title>
<style>
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0}
body{overflow:hidden;background:#020711 url("../background.png") center/cover no-repeat fixed;color:#eaf4ff;font-family:Arial,"Segoe UI",sans-serif}
.wrap{height:100%;display:flex;align-items:center;justify-content:center;padding:20px}
.card{width:min(560px,90vw);padding:30px 34px;border:1px solid rgba(22,140,255,.45);border-radius:16px;background:rgba(2,9,19,.94);box-shadow:0 0 40px rgba(0,100,255,.16);text-align:center}
.brand{font-size:11px;letter-spacing:.35em;color:#7fa9d0;margin-bottom:10px}
h1{margin:0 0 8px;font-size:22px}h1 b{color:#168cff}
.sub{font-size:11px;color:#8ca4bb;margin-bottom:24px}
.bar{height:14px;border-radius:20px;background:#071321;border:1px solid rgba(70,150,235,.3);overflow:hidden}
.fill{height:100%;width:0%;background:linear-gradient(90deg,#075dc4,#168cff);box-shadow:0 0 14px rgba(22,140,255,.7);transition:width .15s}
.percent{font-size:30px;font-weight:700;margin:18px 0 5px;color:#168cff}
.state{font-size:11px;color:#a8bbcc;min-height:16px}
.bytes{font:10px "Courier New",monospace;color:#637f99;margin-top:10px}
</style>

<style id="jb-original-logic-status-ui">
#jb-success-overlay,#jb-failure-overlay{
 position:fixed!important;inset:0!important;width:100vw!important;height:100vh!important;
 display:none;align-items:center!important;justify-content:center!important;
 background:rgba(0,0,0,.58)!important;z-index:2147483647;
 font-family:Arial,sans-serif;backdrop-filter:blur(7px);
}
#jb-success-overlay .box,#jb-failure-overlay .box{
 min-width:340px;max-width:560px;padding:28px 34px;border-radius:20px;
 background:rgba(14,19,28,.97);border:1px solid rgba(255,255,255,.15);
 box-shadow:0 20px 65px rgba(0,0,0,.55);text-align:center;color:#fff;
}
#jb-success-overlay .ok,#jb-failure-overlay .err{font-size:25px;font-weight:700}
#jb-success-overlay .sub,#jb-failure-overlay .sub{margin-top:10px;font-size:15px;opacity:.76;line-height:1.55}
</style>

</head>
<body>

<div id="jb-success-overlay"><div class="box"><div class="ok">✓ تم التفعيل بنجاح</div><div class="sub">جاري الخروج من المتصفح…</div></div></div>
<div id="jb-failure-overlay"><div class="box"><div class="err">✕ فشل التفعيل</div><div class="sub">يرجى إعادة تشغيل جهاز PS4 والمحاولة من جديد.</div></div></div>
<script>
window.showJailbreakSuccess=function(){
 var o=document.getElementById("jb-success-overlay"); if(o)o.style.display="flex";
 setTimeout(function(){try{window.close()}catch(e){}try{window.open("","_self");window.close()}catch(e){}},1200);
};
window.showJailbreakFailure=function(){
 var o=document.getElementById("jb-failure-overlay"); if(o)o.style.display="flex";
};
</script>

<div class="wrap"><div class="card">
<div class="brand">PSFREE-LAPSE EXPLOIT</div>
<h1>OFFLINE CACHE <b>9.00</b></h1>
<div class="sub">Installing all required files — please wait</div>
<div class="bar"><div id="fill" class="fill"></div></div>
<div id="percent" class="percent">0%</div>
<div id="state" class="state">Preparing cache...</div>
<div id="bytes" class="bytes">0 / 0 bytes</div>
</div></div>
<script>
(function(){
'use strict';
var app=window.applicationCache, fill=document.getElementById('fill'),
    percent=document.getElementById('percent'), state=document.getElementById('state'),
    bytes=document.getElementById('bytes'), done=false, last=0;

function setProgress(p,loaded,total){
  p=Math.max(0,Math.min(100,Number(p)||0));
  last=p; fill.style.width=p+'%'; percent.textContent=Math.round(p)+'%';
  if(total>0) bytes.textContent=fmt(loaded)+' / '+fmt(total);
}
function fmt(n){
  n=Number(n)||0;
  if(n<1024) return Math.round(n)+' B';
  if(n<1048576) return (n/1024).toFixed(1)+' KB';
  return (n/1048576).toFixed(2)+' MB';
}
function finish(){
  if(done)return; done=true; setProgress(100,1,1);
  state.textContent='Cache installed successfully — opening exploit...';
  setTimeout(function(){location.replace('index.html');},900);
}
function onChecking(){state.textContent='Checking offline cache...';}
function onDownloading(){state.textContent='Downloading cache files...';setProgress(0,0,0);}
function onProgress(e){
  var total=Number(e.total)||0, loaded=Number(e.loaded)||0;
  if(total>0){setProgress(loaded/total*100,loaded,total);}
  else {state.textContent='Installing cache files...'; if(last<95)setProgress(Math.min(95,last+1),0,0);}
}
function onCached(){finish();}
function onUpdateReady(){try{app.swapCache();}catch(e){} finish();}
function onNoUpdate(){state.textContent='Cache already installed.';finish();}
function onError(){state.textContent='Cache error — retrying...';setTimeout(function(){location.reload();},1200);}

app.addEventListener('checking',onChecking,false);
app.addEventListener('downloading',onDownloading,false);
app.addEventListener('progress',onProgress,false);
app.addEventListener('cached',onCached,false);
app.addEventListener('updateready',onUpdateReady,false);
app.addEventListener('noupdate',onNoUpdate,false);
app.addEventListener('error',onError,false);
app.addEventListener('obsolete',onError,false);

window.addEventListener('load',function(){
  state.textContent='Starting cache installation...';
  setTimeout(function(){
    if(app.status===app.UPDATEREADY || app.status===app.UNCACHED){try{app.update();}catch(e){}}
    else if(app.status===app.IDLE){state.textContent='Cache ready.';setProgress(100,1,1);setTimeout(function(){location.replace('index.html')},700);}
  },80);
},false);
})();
</script>

<script id="jb-all-firmware-status">
(function(){
  var done=false, failed=false;
  function success(){
    if(done||failed)return;
    done=true;
    try{if(typeof window.showJailbreakSuccess==="function")window.showJailbreakSuccess();}catch(e){}
  }
  function failure(){
    if(done||failed)return;
    failed=true;
    try{if(typeof window.showJailbreakFailure==="function")window.showJailbreakFailure();}catch(e){}
  }
  function scan(){
    var t=((document.body&&document.body.innerText)||"").toLowerCase();
    if(/jailbreak activé|jailbreak activated|jailbreak complete|jailbreak completed|jailbreak success|achieved jailbreak|already jailbroken|goldhen.*(loaded|success)|payload.*(loaded|running|success)|kpatched|berhasil/.test(t)) success();
  }
  scan();
  setInterval(scan,300);
  try{new MutationObserver(scan).observe(document.body,{subtree:true,childList:true,characterData:true});}catch(e){}
  window.addEventListener("unhandledrejection",function(e){
    if(!/multiple blurs|blurs before pop/i.test(String(e&&e.reason||""))) failure();
  });
  window.addEventListener("error",function(){failure();});
})();
</script>

</body>
</html>
