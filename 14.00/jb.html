<!doctype html>
<html lang="en" manifest="offline.appcache">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>AMINE PS4</title>
    <!-- This page carries its own styles and starts its own module, and it
         loads NOTHING else. That duplicates a little of style.css, and it is
         deliberate: every subresource is one more allocation and one more
         timing shift in the process that core.js is about to groom, and this
         exploit is decided by exactly that. The landing page may use the
         shared stylesheet; this one may not. -->
    <style>
      :root {
        --bg: #0b0d10;
        --panel: #0e1116;
        --sunk: #11151b;
        --line: #1e2732;
        --fg: #c8ced8;
        --bright: #e6ebf2;
        --dim: #7c8798;
        --faint: #4d5765;
        --ok: #7fd0a0;
        --bad: #d08a7f;
        --warn: #d8c07f;
        --sans: "Segoe UI", system-ui, sans-serif;
        --mono: Consolas, "DejaVu Sans Mono", monospace;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        min-height: 100%;
        background: var(--bg);
        color: var(--fg);
        font: 15px/1.45 var(--sans);
      }
      #brand {
        padding: 8px 10px;
        border-bottom: 1px solid var(--line);
        background: var(--panel);
        text-align: center;
      }
      #brand b {
        color: var(--bright);
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 0.14em;
      }
      /* The live heap readout sits in the flow under the bar. Nothing here
         scrolls the document itself, so it stays in view without being
         positioned over the wordmark. */
      #ramBox {
        overflow: hidden;
        padding: 5px 10px;
        border-bottom: 1px solid var(--line);
        background: var(--sunk);
        color: var(--ok);
        font: 11px/1.4 var(--mono);
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      /* Running: a spinner under the bar. jb.js switches the body to .done,
         .fail or .log. */
      #spin {
        position: fixed;
        top: calc(50% + 20px);
        left: 50%;
        width: 46px;
        height: 46px;
        margin: -23px 0 0 -23px;
        border: 4px solid var(--line);
        border-top-color: var(--ok);
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      #msg {
        position: fixed;
        top: 50%;
        left: 0;
        right: 0;
        transform: translateY(-50%);
        display: none;
        text-align: center;
        font-size: 16px;
        letter-spacing: 0.5px;
      }
      #state,
      #out {
        display: none;
      }
      body.done #spin,
      body.fail #spin {
        display: none;
      }
      body.fail #msg {
        display: block;
      }
      body.done #msg {
        display: block;
        color: var(--ok);
        font-weight: 700;
        letter-spacing: 2px;
      }
      /* ?log=1 -- the full step log. Laid out with flex rather than by
         subtracting a header height from 100vh. */
      body.log {
        display: flex;
        flex-direction: column;
        height: 100vh;
      }
      body.log #spin,
      body.log #msg {
        display: none;
      }
      body.log #wrap {
        display: flex;
        flex-direction: column;
        flex: 1;
        min-height: 0;
        padding: 14px 18px 30px;
      }
      body.log #state {
        display: block;
        margin: 0 0 8px;
        font-size: 22px;
        font-weight: 700;
      }
      body.log #out {
        display: block;
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        padding: 10px 12px;
        border: 1px solid var(--line);
        border-radius: 5px;
        background: var(--sunk);
        font: 12px/1.45 var(--mono);
        white-space: pre-wrap;
      }
      /* The retry notice, raised by jb.js when the chain throws or stalls. */
      .notice {
        margin: 1em 0;
        padding: 0.7em 1em;
        border: 2px solid #e66;
        background: #2a1414;
        color: #f99;
        font: 700 20px/1.4 var(--sans);
      }
      .byline {
        position: fixed;
        bottom: 9px;
        left: 11px;
        margin: 0;
        color: var(--faint);
        font: 11px/1 var(--mono);
        letter-spacing: 0.06em;
      }
      .ok {
        color: var(--ok);
      }
      .bad {
        color: var(--bad);
      }
      .warn {
        color: var(--warn);
      }
      code { color: #9fb3d0; }
      /* AMINE PS4 boot screen — compact visual theme only. */
      :root {
        --bg:#050a13; --panel:#0d1828; --sunk:#091422; --line:#244766;
        --fg:#e8f2ff; --bright:#f4f8ff; --dim:#91a8c2; --faint:#617b96;
        --ok:#62e6b6; --bad:#ff718e; --warn:#ffd27a;
      }
      html, body {
        background:#050a13;
        color:var(--fg);
        font-family:"Segoe UI",Arial,system-ui,sans-serif;
      }
      body:not(.log)::before {
        content:"";
        position:fixed;
        z-index:0;
        left:50%; top:50%;
        width:min(440px,calc(100vw - 32px));
        height:220px;
        transform:translate(-50%,-43%);
        border:1px solid var(--line);
        border-radius:14px;
        background:linear-gradient(180deg,#10223a,#0a1423);
        box-shadow:0 12px 30px rgba(0,0,0,.25);
      }
      #brand {
        position:relative; z-index:2;
        padding:13px 10px;
        background:#081321;
        border-bottom:1px solid var(--line);
        box-shadow:none;
      }
      #brand b {
        color:var(--bright);
        font-size:17px;
        font-weight:850;
        letter-spacing:.2em;
        text-shadow:none;
      }
      #brand b span { color:#42c8ff; }
      #ramBox {
        position:relative; z-index:2;
        padding:6px 10px;
        border-bottom:1px solid var(--line);
        background:#091422;
        color:var(--ok);
        font:11px/1.4 Consolas,"DejaVu Sans Mono",monospace;
        text-align:center;
      }
      #spin {
        z-index:1;
        top:calc(50% - 34px);
        width:42px; height:42px;
        margin:-21px 0 0 -21px;
        border:3px solid #244766;
        border-top-color:#42c8ff;
        border-right-color:#31d6b0;
        animation:spin 1.1s linear infinite;
      }
      #msg {
        z-index:1;
        top:calc(50% + 42px);
        padding:0 18px;
        color:var(--dim);
        font-size:13px;
        font-weight:800;
        letter-spacing:.08em;
      }
      body.done #msg {
        color:var(--ok);
        font-size:15px;
        letter-spacing:.12em;
      }
      body.fail #msg {
        color:var(--bad);
        font-size:14px;
      }
      body.log { background:#050a13; }
      body.log #wrap { padding:14px 16px 24px; }
      body.log #state {
        color:var(--ok);
        font-size:18px;
        letter-spacing:.04em;
      }
      body.log #out {
        border:1px solid var(--line);
        border-radius:8px;
        background:#081321;
        color:#d8e5ff;
      }
      .notice {
        border:1px solid #7c3347;
        border-radius:8px;
        background:#24101a;
        color:#ff9bad;
        font-size:15px;
      }
      .byline { color:var(--faint); }
      .ok { color:var(--ok); }
      .bad { color:var(--bad); }
      .warn { color:var(--warn); }
      code { color:#8fdcff; }
      @media(max-width:520px) {
        body:not(.log)::before {
          height:200px;
          transform:translate(-50%,-42%);
        }
        #brand { padding:11px 8px; }
        #brand b { font-size:15px; }
        #spin { top:calc(50% - 29px); width:38px; height:38px; margin:-19px 0 0 -19px; }
        #msg { top:calc(50% + 37px); font-size:12px; }
      }
      @media(prefers-reduced-motion:reduce) {
        #spin { animation:none; }
      }
    </style>
  </head>
  <body>
    <!-- jb.js owns the body class: .log while the step log is shown, .done or
         .fail once the chain has settled. The ids below are its contract --
         #ramBox, #msg, #state and #out are read by name. -->
    <div id="brand"><b>AMINE <span>PS4</span></b></div>
    <div id="ramBox">RAM: checking...</div>
    <div id="spin"></div>
    <div id="msg">Restart your console</div>
    <div id="wrap">
      <div id="state"></div>
      <div id="out"></div>
    </div>
    <p class="byline">by well0nez/m0zz</p>
    <script type="module">
      import "./jb.js";
    </script>
  </body>
</html>
